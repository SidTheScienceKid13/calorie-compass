name: CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build production app
        run: npm run build

      - name: Build Docker image
        run: docker build --tag calorie-compass:${{ github.sha }} .

      - name: Start Docker container
        run: docker run -d --name calorie-compass -p 3000:3000 calorie-compass:${{ github.sha }}

      - name: Verify container serves the application
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs calorie-compass
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm --force calorie-compass || true